plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

version = "${mod_version}"

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    implementation("net.blay09.mods:balm-common:${balm_version}") {
        changing = true
    }

    // compileOnly (not implementation): hbs_foundation publishes a shared capability
    // 'com.holybuckets.foundation:hbs_foundation' on every variant, so letting foundation-common
    // leak onto the loader classpaths (which already carry foundation-fabric/-neoforge) triggers a
    // capability conflict. The loader jars merge the common classes in via commonJava, so the loaders
    // get foundation's common classes from foundation-<loader>; :common only needs it at compile time.
    compileOnly("com.holybuckets.foundation:hbs_foundation-common-${minecraft_version}:${foundation_version}") {
        changing = true
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
